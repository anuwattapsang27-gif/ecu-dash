<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBD2 by Mos ReMap - Honda/Yamaha</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Tahoma", sans-serif; }
        body { background-color: #0f0f11; color: #ffffff; padding: 10px; padding-bottom: 70px; min-height: 100vh; }
        .header { text-align: center; color: #e63946; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .card { background: #18181c; border: 1px solid #2a2a30; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
        .rpm-val { font-size: 40px; font-weight: bold; color: #00f5d4; font-family: 'Impact', monospace; }
        .val { font-size: 18px; font-weight: bold; color: #00ff00; font-family: monospace; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; }
        button { border: none; border-radius: 8px; font-weight: bold; font-size: 12px; padding: 10px; cursor: pointer; }
        
        /* Modal Fix */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .dtc-box { height: 200px; width: 90%; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #444; color: #00f5d4; font-size: 12px; }
        
        /* Navbar & Tabs */
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181c; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px; z-index: 90; }
        .nav-btn { background: none; color: #888; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }
        .nav-btn.active { color: #00f5d4; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Table */
        .table-container { overflow-x: auto; max-height: 350px; border: 1px solid #333; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 11px; }
        td.cell-val.recorded { background: #003020; color: #00f5d4; }
    </style>
</head>
<body>
    <div class="header">OBD2 by Mos ReMap</div>

    <!-- โปรโตคอลเลือกค่าย -->
    <div class="card">
        <select id="protocol-select" style="width:100%; padding:8px; background:#222; color:#fff; border-radius:6px;">
            <option value="AUTO">อัตโนมัติ (AUTO)</option>
            <option value="HONDA_CAN">Honda (CAN BUS)</option>
            <option value="YAMAHA_KLINE">Yamaha (K-Line)</option>
        </select>
    </div>

    <div id="tab-dash" class="tab-content active">
        <div class="card" style="text-align:center;">
            <div class="label">ENGINE RPM</div>
            <div id="rpm" class="rpm-val">---</div>
        </div>
        <div class="card">
            <div class="sensor-row" style="display:flex; justify-content:space-between;"><span>AFR:</span><span id="afr" class="val">---</span></div>
            <div class="sensor-row" style="display:flex; justify-content:space-between;"><span>TPS:</span><span id="tps" class="val">---</span></div>
        </div>
        <button style="width:100%; background:#00f5d4;" onclick="toggleConnect()">เชื่อมต่อ/ตัดการเชื่อมต่อ</button>
    </div>

    <div id="tab-tune" class="tab-content">
        <div class="table-container">
            <table id="ve-table">
                <thead><tr id="table-header-row"><th>RPM \ TPS</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Modals -->
    <div id="dtc-modal" class="modal"><div class="card" style="width:300px;"><div id="dtc-box" class="dtc-box">...</div><button onclick="closeDtc()">ปิด</button></div></div>

    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('dash', this)">📊 Dashboard</button>
        <button class="nav-btn" onclick="switchTab('tune', this)">🧮 Tuning</button>
    </div>

    <script>
        // รวม Database โค้ด Honda/Yamaha
        const DTC_DB = {
            "P0105": "MAP Sensor (ฮอนด้า/ยามาฮ่า)",
            "P0120": "TPS Sensor ขัดข้อง",
            "P0335": "เซนเซอร์ข้อเหวี่ยงเสีย",
            "P0112": "IAT Sensor ไอดีเย็นผิดปกติ",
            "P0117": "ECT Sensor เครื่องยนต์ร้อนเกินไป"
        };
        
        // ... โค้ดที่เหลือคงระบบเดิมแต่เพิ่มฟังก์ชันเลือก Protocol ใน connect() ...
        // หากต้องการให้ผมเขียนส่วน Protocol Selector แบบละเอียดเพิ่ม บอกได้เลยนะครับ!
    </script>
</body>
</html>
