<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBD2 by Mos ReMap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Tahoma", sans-serif; }
        body { background-color: #0f0f11; color: #ffffff; padding: 10px; min-height: 100vh; }
        .header { text-align: center; color: #e63946; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .card { background: #18181c; border: 1px solid #2a2a30; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
        .grid-3 { display: flex; gap: 6px; margin-bottom: 8px; }
        .grid-item { flex: 1; background: #18181c; border-radius: 8px; padding: 6px; text-align: center; border: 1px solid #333; }
        .rpm-val { font-size: 40px; font-weight: bold; color: #00f5d4; font-family: 'Impact', monospace; }
        .val { font-size: 18px; font-weight: bold; color: #00ff00; font-family: monospace; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .sensor-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; border-bottom: 1px solid #222228; padding-bottom: 3px; }
        button { border: none; border-radius: 8px; font-weight: bold; font-size: 12px; padding: 10px; cursor: pointer; flex: 1; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); padding: 20px; z-index: 99; }
        .dtc-box { height: 180px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #444; color: #00f5d4; font-family: monospace; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">OBD2 by Mos ReMap</div>
    
    <!-- GPS Area -->
    <div class="card" style="display:flex; justify-content:space-around;">
        <div style="text-align:center;"><div class="label">GPS SPEED</div><div id="gps-speed" class="val" style="font-size:24px;">0</div></div>
        <div style="text-align:center;"><div class="label">MAX</div><div id="gps-max" class="val">0</div></div>
        <div style="text-align:center;"><div class="label">TRIP</div><div id="gps-dist" class="val">0.00</div></div>
    </div>

    <!-- จูน Area -->
    <div class="card" style="text-align:center;">
        <div class="label">ENGINE RPM</div>
        <div id="rpm" class="rpm-val">---</div>
    </div>
    <div class="grid-3">
        <div class="grid-item"><div class="label">TPS %</div><div id="tps" class="val">---</div></div>
        <div class="grid-item"><div class="label">MAP (kPa)</div><div id="map" class="val">---</div></div>
        <div class="grid-item"><div class="label">AFR</div><div id="afr" class="val">---</div></div>
    </div>

    <!-- เซ็นเซอร์ครบชุด -->
    <div class="card">
        <div class="sensor-row"><span>O2 Sensor (V):</span><span id="o2-volt" class="val">---</span></div>
        <div class="sensor-row"><span>ECT (°C):</span><span id="ect" class="val">---</span></div>
        <div class="sensor-row"><span>IAT (°C):</span><span id="iat" class="val">---</span></div>
        <div class="sensor-row"><span>BAT (V):</span><span id="bat" class="val">---</span></div>
    </div>

    <div style="display:flex; gap:5px;">
        <button id="btn-connect" style="background:#00f5d4;" onclick="toggleConnect()">เชื่อมต่อ</button>
        <button style="background:#457b9d; color:#fff;" onclick="resetTrip()">รีเซ็ตทริป</button>
        <button style="background:#e63946; color:#fff;" onclick="openDtc()">เช็ก DTC</button>
    </div>

    <div id="dtc-modal" class="modal"><div class="card"><div id="dtc-box" class="dtc-box">...</div><button onclick="closeDtc()">ปิด</button></div></div>

    <script>
        const UART_UUIDS = ['0000fff0-0000-1000-8000-0800200c9a66', '00001101-0000-1000-8000-0800200c9a66', '0000ffe0-0000-1000-8000-0800200c9a66'];
        let rxChar, txChar, isConn=false, minTps=45, maxTps=230;
        let maxSpeed=0, totalDistance=0, lastLat=null, lastLon=null;

        function resetTrip() { maxSpeed=0; totalDistance=0; document.getElementById('gps-max').innerText="0"; document.getElementById('gps-dist').innerText="0.00"; }

        // GPS Logic
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(pos => {
                let speed = Math.round((pos.coords.speed || 0) * 3.6);
                document.getElementById('gps-speed').innerText = speed;
                if (speed > maxSpeed) { maxSpeed = speed; document.getElementById('gps-max').innerText = maxSpeed; }
                if (lastLat) totalDistance += 0.001; // Simplified distance
                document.getElementById('gps-dist').innerText = totalDistance.toFixed(2);
                lastLat = pos.coords.latitude; lastLon = pos.coords.longitude;
            }, null, { enableHighAccuracy: true });
        }

        async function toggleConnect() { isConn ? location.reload() : connect(); }
        async function connect() {
            try {
                let dev = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices: UART_UUIDS});
                let server = await dev.gatt.connect();
                let serv = (await server.getPrimaryServices())[0];
                let chars = await serv.getCharacteristics();
                chars.forEach(c => { if(c.properties.notify) rxChar = c; if(c.properties.write) txChar = c; });
                await rxChar.startNotifications();
                rxChar.addEventListener('characteristicvaluechanged', (e) => parse(new TextDecoder().decode(e.target.value)));
                isConn = true;
                await sendCmd("AT Z"); await sendCmd("010C");
                poll();
            } catch(e) { alert(e); }
        }

        async function sendCmd(cmd) { if(txChar) txChar.writeValue(new TextEncoder().encode(cmd + "\r")); }
        
        async function poll() { 
            if(!isConn) return;
            // เน้นความสำคัญ: จูนโหมด (RPM, TPS, MAP, AFR) มาก่อน
            await sendCmd("010C"); await sendCmd("0111"); await sendCmd("010B"); await sendCmd("0114");
            // วินิจฉัยโหมด (ECT, IAT, BAT) มาลำดับสอง
            await sendCmd("0105"); await sendCmd("010F"); await sendCmd("0142");
            setTimeout(poll, 180); 
        }

        function parse(hex) {
            let b = hex.toUpperCase().split(" ");
            for(let i=0; i<b.length; i++) {
                if(b[i]=="41") {
                    let pid = b[i+1];
                    if(pid=="0C") document.getElementById('rpm').innerText = Math.round(((parseInt(b[i+2],16)*256)+parseInt(b[i+3],16))/4);
                    if(pid=="11") { let t = Math.round(((parseInt(b[i+2],16)-minTps)*100)/(maxTps-minTps)); document.getElementById('tps').innerText = (t<0?0:(t>100?100:t)); }
                    if(pid=="0B") document.getElementById('map').innerText = parseInt(b[i+2],16);
                    if(pid=="05") document.getElementById('ect').innerText = parseInt(b[i+2],16)-40;
                    if(pid=="0F") document.getElementById('iat').innerText = parseInt(b[i+2],16)-40;
                    if(pid=="14") { 
                        let v = (parseInt(b[i+2],16)/200).toFixed(2); document.getElementById('o2-volt').innerText = v;
                        let mv = v*1000;
                        let afr = (mv > 900) ? "12.2 (Rich)" : (mv > 800) ? "12.8 (Rich)" : (mv > 600) ? "13.5" : (mv > 300) ? "14.5" : "15.5+ (Lean)";
                        document.getElementById('afr').innerText = afr;
                    }
                    if(pid=="42") document.getElementById('bat').innerText = (((parseInt(b[i+2],16)*256)+parseInt(b[i+3],16))/1000).toFixed(1);
                }
            }
        }
        function openDtc() { document.getElementById('dtc-modal').style.display = 'flex'; }
        function closeDtc() { document.getElementById('dtc-modal').style.display = 'none'; }
        async function readDTC() { let res = await sendCmd("03"); document.getElementById('dtc-box').innerText = "พบโค้ด: " + res; }
        async function clearDTC() { await sendCmd("04"); await sendCmd("AT Z"); alert("ล้างค่าเรียบร้อย"); }
    </script>
</body>
</html>
