<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBD2 by Mos ReMap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Tahoma", sans-serif; }
        body { background-color: #0f0f11; color: #ffffff; padding: 10px; padding-bottom: 70px; min-height: 100vh; }
        .header { text-align: center; color: #e63946; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .card { background: #18181c; border: 1px solid #2a2a30; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
        .grid-3 { display: flex; gap: 6px; margin-bottom: 8px; }
        .grid-item { flex: 1; background: #18181c; border-radius: 8px; padding: 6px; text-align: center; border: 1px solid #333; }
        .rpm-val { font-size: 40px; font-weight: bold; color: #00f5d4; font-family: 'Impact', monospace; }
        .val { font-size: 18px; font-weight: bold; color: #00ff00; font-family: monospace; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .sensor-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; border-bottom: 1px solid #222228; padding-bottom: 3px; }
        button { border: none; border-radius: 8px; font-weight: bold; font-size: 12px; padding: 10px; cursor: pointer; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); padding: 20px; z-index: 99; }
        .dtc-box { height: 180px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #444; color: #00f5d4; font-family: monospace; font-size: 11px; }
        
        /* Tab Menu Bar */
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181c; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px; z-index: 90; }
        .nav-btn { background: none; color: #888; font-size: 12px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border: none; flex: 1; }
        .nav-btn.active { color: #00f5d4; }

        /* Tuning Table Styles */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tuning-header { display: flex; justify-content: space-around; background: #1c1c22; padding: 8px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .table-container { overflow-x: auto; max-height: 380px; border: 1px solid #333; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; font-family: monospace; }
        th, td { border: 1px solid #2a2a30; padding: 8px 4px; }
        th { background: #22222b; color: #ff9f1c; position: sticky; top: 0; }
        td.cell-val { background: #111; color: #fff; cursor: pointer; }
        td.cell-val.recorded { background: #003020; color: #00f5d4; }
        .target-box { background: #222; padding: 5px 10px; border-radius: 6px; border: 1px solid #444; color: #ff9f1c; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">OBD2 by Mos ReMap</div>

    <div id="tab-dash" class="tab-content active">
        <div class="card" style="display:flex; justify-content:space-around;">
            <div style="text-align:center;"><div class="label">GPS SPEED</div><div id="gps-speed" class="val" style="font-size:24px;">0</div></div>
            <div style="text-align:center;"><div class="label">MAX</div><div id="gps-max" class="val">0</div></div>
            <div style="text-align:center;"><div class="label">TRIP</div><div id="gps-dist" class="val">0.00</div></div>
        </div>

        <div class="card" style="text-align:center;">
            <div class="label">ENGINE RPM</div>
            <div id="rpm" class="rpm-val">---</div>
        </div>
        <div class="grid-3">
            <div class="grid-item"><div class="label">TPS %</div><div id="tps" class="val">---</div></div>
            <div class="grid-item"><div class="label">MAP (kPa)</div><div id="map" class="val">---</div></div>
            <div class="grid-item"><div class="label">AFR</div><div id="afr" class="val">---</div></div>
        </div>

        <div class="card">
            <div class="sensor-row"><span>O2 Sensor (V):</span><span id="o2-volt" class="val">---</span></div>
            <div class="sensor-row"><span>ECT (°C):</span><span id="ect" class="val">---</span></div>
            <div class="sensor-row"><span>IAT (°C):</span><span id="iat" class="val">---</span></div>
            <div class="sensor-row"><span>BAT (V):</span><span id="bat" class="val">---</span></div>
        </div>

        <div style="display:flex; gap:5px;">
            <button id="btn-connect" style="background:#00f5d4; color:#000;" onclick="toggleConnect()">เชื่อมต่อ</button>
            <button style="background:#457b9d; color:#fff;" onclick="resetTrip()">รีเซ็ตทริป</button>
            <button style="background:#e63946; color:#fff;" onclick="openDtc()">เช็ก DTC</button>
        </div>
    </div>

    <div id="tab-tune" class="tab-content">
        <div class="tuning-header">
            <div>AFR วัดได้จริง: <span id="cur-afr" style="color:#00f5d4; font-weight:bold;">---</span></div>
            <div>Target: <span id="target-display" class="target-box" onclick="openTargetModal()">13.5</span></div>
            <div><button style="background:#e63946; color:#fff; padding:6px 10px;" onclick="startRecordToggle()" id="rec-btn">⏺ เริ่มเก็บค่าเฉลี่ย</button></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:11px;">
            <span style="color:#ff9f1c;" id="rec-status">สถานะ: พร้อมบันทึกตาราง</span>
            <button style="background:#333; color:#ff9f1c; padding:4px 8px;" onclick="clearTable()">🔄 ล้างค่าในตาราง</button>
        </div>

        <div class="table-container">
            <table id="ve-table">
                <thead>
                    <tr>
                        <th>RPM \ TPS</th>
                        <th>0%</th><th>5%</th><th>10%</th><th>20%</th><th>40%</th><th>60%</th><th>100%</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
        <div class="card" style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11px; color:#888;">ค่าชดเชยปัจจุบัน:</span>
            <span id="corr-val" class="val" style="color:#ff9f1c;">0.0%</span>
        </div>
    </div>

    <div id="target-modal" class="modal">
        <div class="card" style="max-width:300px; margin:auto; margin-top:30vh;">
            <div style="font-weight:bold; margin-bottom:10px; color:#ff9f1c;">ตั้งค่าเป้าหมาย Target AFR</div>
            <input type="number" id="input-target" step="0.1" value="13.5" style="width:100%; padding:10px; background:#000; color:#00f5d4; border:1px solid #444; border-radius:6px; font-size:18px; text-align:center; margin-bottom:10px;">
            <div style="display:flex; gap:6px;">
                <button style="background:#e63946; color:#fff;" onclick="saveTarget()">ตกลง</button>
                <button style="background:#444; color:#fff;" onclick="closeTargetModal()">ยกเลิก</button>
            </div>
        </div>
    </div>

    <div id="dtc-modal" class="modal"><div class="card"><div id="dtc-box" class="dtc-box">...</div><button style="background:#444; color:#fff; margin-top:10px;" onclick="closeDtc()">ปิด</button></div></div>

    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('dash', this)">📊 <span>Dashboard</span></button>
        <button class="nav-btn" onclick="switchTab('tune', this)">🧮 <span>Tuning Table</span></button>
    </div>

    <script>
        const UART_UUIDS = ['0000fff0-0000-1000-8000-0800200c9a66', '00001101-0000-1000-8000-0800200c9a66', '0000ffe0-0000-1000-8000-0800200c9a66'];
        let rxChar, txChar, isConn=false, minTps=45, maxTps=230;
        let maxSpeed=0, totalDistance=0, lastLat=null, lastLon=null;
        
        // ตัวแปรระบบ Tuning Table
        let rpmRows = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000];
        let tpsCols = [0, 5, 10, 20, 40, 60, 100];
        let tableData = {}; // เก็บข้อมูล { "RPM_TPS": { sum, count, val } }
        let targetAfr = 13.5;
        let isRecording = false;
        let currentRpm = 0, currentTps = 0, currentAfrNum = 14.7;

        // สร้างตาราง Matrix บนหน้าเว็บ
        function buildTable() {
            let tbody = document.querySelector("#ve-table tbody");
            tbody.innerHTML = "";
            rpmRows.forEach(rpm => {
                let tr = document.createElement("tr");
                let th = document.createElement("th");
                th.innerText = rpm;
                tr.appendChild(th);
                
                tpsCols.forEach(tps => {
                    let td = document.createElement("td");
                    td.className = "cell-val";
                    td.id = `cell_${rpm}_${tps}`;
                    td.innerText = "-";
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
        buildTable();

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            if(tabName === 'dash') document.getElementById('tab-dash').classList.add('active');
            if(tabName === 'tune') document.getElementById('tab-tune').classList.add('active');
            btn.classList.add('active');
        }

        function openTargetModal() { document.getElementById('target-modal').style.display = 'block'; }
        function closeTargetModal() { document.getElementById('target-modal').style.display = 'none'; }
        function saveTarget() {
            let val = parseFloat(document.getElementById('input-target').value);
            if(!isNaN(val)) { targetAfr = val; document.getElementById('target-display').innerText = targetAfr.toFixed(1); }
            closeTargetModal();
        }

        function startRecordToggle() {
            isRecording = !isRecording;
            let btn = document.getElementById('rec-btn');
            let stat = document.getElementById('rec-status');
            if(isRecording) {
                btn.style.background = "#00f5d4";
                btn.style.color = "#000";
                btn.innerText = "⏹ หยุดบันทึก";
                stat.innerText = "สถานะ: กำลังบันทึกค่าลงตาราง...";
                stat.style.color = "#00f5d4";
            } else {
                btn.style.background = "#e63946";
                btn.style.color = "#fff";
                btn.innerText = "⏺ เริ่มเก็บค่าเฉลี่ย";
                stat.innerText = "สถานะ: หยุดบันทึกแล้ว";
                stat.style.color = "#ff9f1c";
            }
        }

        function clearTable() {
            if(confirm("ต้องการล้างข้อมูลในตารางทั้งหมดใช่หรือไม่?")) {
                tableData = {};
                buildTable();
            }
        }

        // หาพิกัดช่องที่ใกล้เคียงที่สุดในตาราง Matrix
        function getClosestCell(rpm, tps) {
            let rRow = rpmRows.reduce((prev, curr) => Math.abs(curr - rpm) < Math.abs(prev - rpm) ? curr : rpmRows[0]);
            let cCol = tpsCols.reduce((prev, curr) => Math.abs(curr - tps) < Math.abs(prev - curr) ? curr : tpsCols[0]);
            return { rpm: rRow, tps: cCol };
        }

        function updateTuningMatrix(rpm, tps, afrVal) {
            if(!isRecording || isNaN(afrVal)) return;
            let pos = getClosestCell(rpm, tps);
            let key = `${pos.rpm}_${pos.tps}`;
            
            if(!tableData[key]) { tableData[key] = { sum: 0, count: 0 }; }
            tableData[key].sum += afrVal;
            tableData[key].count += 1;
            
            let avg = tableData[key].sum / tableData[key].count;
            let cell = document.getElementById(`cell_${pos.rpm}_${pos.tps}`);
            if(cell) {
                cell.innerText = avg.toFixed(1);
                cell.classList.add('recorded');
            }

            // คำนวณค่าชดเชย (%) เทียบกับ Target AFR
            let corr = ((targetAfr - avg) / avg) * 100;
            let corrEl = document.getElementById('corr-val');
            corrEl.innerText = (corr > 0 ? "+" : "") + corr.toFixed(1) + "%";
            corrEl.style.color = corr > 0 ? "#00ff00" : "#ff4444";
        }

        function resetTrip() { maxSpeed=0; totalDistance=0; document.getElementById('gps-max').innerText="0"; document.getElementById('gps-dist').innerText="0.00"; }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(pos => {
                let speed = Math.round((pos.coords.speed || 0) * 3.6);
                document.getElementById('gps-speed').innerText = speed;
                if (speed > maxSpeed) { maxSpeed = speed; document.getElementById('gps-max').innerText = maxSpeed; }
                if (lastLat) totalDistance += 0.001;
                document.getElementById('gps-dist').innerText = totalDistance.toFixed(2);
                lastLat = pos.coords.latitude; lastLon = pos.coords.longitude;
            }, null, { enableHighAccuracy: true });
        }

        async function toggleConnect() { isConn ? location.reload() : connect(); }
        async function connect() {
            try {
                let dev = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices: UART_UUIDS});
                let server = await dev.gatt.connect();
                let serv = (await server.getPrimaryServices())[0];
                let chars = await serv.getCharacteristics();
                chars.forEach(c => { if(c.properties.notify) rxChar = c; if(c.properties.write) txChar = c; });
                await rxChar.startNotifications();
                rxChar.addEventListener('characteristicvaluechanged', (e) => parse(new TextDecoder().decode(e.target.value)));
                isConn = true;
                await sendCmd("AT Z"); await sendCmd("010C");
                poll();
            } catch(e) { alert(e); }
        }

        async function sendCmd(cmd) { if(txChar) txChar.writeValue(new TextEncoder().encode(cmd + "\r")); }
        
        async function poll() { 
            if(!isConn) return;
            await sendCmd("010C"); await sendCmd("0111"); await sendCmd("010B"); await sendCmd("0114");
            await sendCmd("0105"); await sendCmd("010F"); await sendCmd("0142");
            setTimeout(poll, 180); 
        }

        function parse(hex) {
            let b = hex.toUpperCase().split(" ");
            for(let i=0; i<b.length; i++) {
                if(b[i]=="41") {
                    let pid = b[i+1];
                    if(pid=="0C") {
                        currentRpm = Math.round(((parseInt(b[i+2],16)*256)+parseInt(b[i+3],16))/4);
                        document.getElementById('rpm').innerText = currentRpm;
                    }
                    if(pid=="11") { 
                        let t = Math.round(((parseInt(b[i+2],16)-minTps)*100)/(maxTps-minTps)); 
                        currentTps = (t<0?0:(t>100?100:t));
                        document.getElementById('tps').innerText = currentTps; 
                    }
                    if(pid=="0B") document.getElementById('map').innerText = parseInt(b[i+2],16);
                    if(pid=="05") document.getElementById('ect').innerText = parseInt(b[i+2],16)-40;
                    if(pid=="0F") document.getElementById('iat').innerText = parseInt(b[i+2],16)-40;
                    if(pid=="14") { 
                        let v = (parseInt(b[i+2],16)/200).toFixed(2); 
                        document.getElementById('o2-volt').innerText = v;
                        let mv = v*1000;
                        
                        // ประเมินค่าตัวเลข AFR จำลองตาม mV
                        if (mv > 900) currentAfrNum = 12.2;
                        else if (mv > 800) currentAfrNum = 12.8;
                        else if (mv > 600) currentAfrNum = 13.5;
                        else if (mv > 300) currentAfrNum = 14.5;
                        else currentAfrNum = 15.5;

                        document.getElementById('afr').innerText = currentAfrNum.toFixed(1) + (mv > 800 ? " (Rich)" : mv < 300 ? " (Lean)" : "");
                        document.getElementById('cur-afr').innerText = currentAfrNum.toFixed(1);

                        // ส่งข้อมูลเข้าตาราง Matrix อัตโนมัติถ้ากดปุ่ม Record อยู่
                        updateTuningMatrix(currentRpm, currentTps, currentAfrNum);
                    }
                    if(pid=="42") document.getElementById('bat').innerText = (((parseInt(b[i+2],16)*256)+parseInt(b[i+3],16))/1000).toFixed(1);
                }
            }
        }
        function openDtc() { document.getElementById('dtc-modal').style.display = 'flex'; }
        function closeDtc() { document.getElementById('dtc-modal').style.display = 'none'; }
        async function readDTC() { let res = await sendCmd("03"); document.getElementById('dtc-box').innerText = "พบโค้ด: " + res; }
        async function clearDTC() { await sendCmd("04"); await sendCmd("AT Z"); alert("ล้างค่าเรียบร้อย"); }
    </script>
</body>
</html>
