<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOS REMAP DASHBOARD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Gadget, sans-serif; user-select: none; }
        body { background-color: #080808; color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Vertical Dashboard Layout */
        .dashboard { width: 100vw; height: 100vh; max-width: 480px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); border: 1px solid #222; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        
        /* Top Navigation Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 35px; z-index: 10; }
        .menu-btn { font-size: 22px; color: #fff; cursor: pointer; text-shadow: 0 0 5px #fff; }
        .gps-status { font-size: 11px; color: #00e676; letter-spacing: 1px; font-weight: bold; }
        
        /* Main Gauge (Speed & RPM) */
        .gauge-section { display: flex; justify-content: center; align-items: center; margin: 5px 0; }
        .main-gauge { width: 230px; height: 230px; border-radius: 50%; border: 7px solid #e6e6e6; background: #111; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(255,255,255,0.15), inset 0 0 15px #000; }
        
        .brand-logo { position: absolute; top: 15px; font-size: 12px; font-weight: 900; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }
        .brand-logo span { color: #ff3d00; }
        .shield-icon { width: 11px; height: 11px; background: #ff3d00; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }

        .max-badge { font-size: 9px; color: #ff3d00; background: rgba(255,61,0,0.15); border: 1px solid rgba(255,61,0,0.4); padding: 1px 6px; border-radius: 10px; cursor: pointer; margin-top: 15px; }

        .speed-val { font-size: 50px; font-weight: 900; color: #fff; line-height: 0.95; margin-top: 2px; }
        .unit-label { font-size: 10px; color: #888; margin-bottom: 2px; }
        .rpm-val { font-size: 24px; color: #fff; font-weight: 800; border-top: 2px solid #333; padding-top: 2px; width: 75%; text-align: center; }
        
        .time-date { position: absolute; bottom: 8px; font-size: 9px; color: #888; text-align: center; }

        /* Middle Quick Cards (TPS & AFR) */
        .mid-container { display: flex; gap: 10px; width: 100%; margin-bottom: 5px; }
        .arc-card { flex: 1; background: rgba(255,255,255,0.05); border-left: 4px solid #ffff00; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
        .arc-title { font-size: 13px; color: #ffff00; font-weight: bold; }
        .arc-val { font-size: 22px; font-weight: bold; color: #fff; }

        /* Bottom ECU Data Grid */
        .bottom-container { background: rgba(0,0,0,0.5); border-radius: 10px; padding: 10px; border: 1px solid #222; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .data-card { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .data-label { font-size: 11px; color: #ffff00; font-weight: bold; }
        .data-label span { font-size: 8px; color: #888; }
        .data-val { font-size: 14px; font-weight: bold; color: #fff; }
        
        /* Highlight Trip Card */
        .trip-card { grid-column: span 2; background: rgba(0, 230, 118, 0.1); border: 1px solid rgba(0, 230, 118, 0.3); cursor: pointer; }
        .trip-card .data-label { color: #00e676; }

        /* Bluetooth Floating Button & Status */
        .footer-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 5px; }
        .bt-btn { width: 40px; height: 40px; border-radius: 50%; background: #ff1744; border: 2px solid #fff; display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; box-shadow: 0 0 10px rgba(255,23,68,0.8); }
        .status-text { font-size: 10px; color: #666; font-weight: bold; text-align: right; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="menu-btn" onclick="clearDTC()">☰</div>
        <div class="gps-status" id="gpsStatus">GPS: WAITING</div>
    </div>

    <!-- Center Main Gauge -->
    <div class="gauge-section">
        <div class="main-gauge">
            <div class="brand-logo">
                <div class="shield-icon"></div>
                MOS <span>REMAP</span>
            </div>
            
            <div class="max-badge" onclick="resetMaxValues()" title="แตะเพื่อรีเซ็ตค่าสูงสุด">
                MAX: <span id="maxSpeedVal">0</span> km/h
            </div>

            <div class="speed-val" id="speedVal">0</div>
            <div class="unit-label">km/h (GPS)</div>
            <div class="rpm-val" id="rpmVal">0</div>
            <div class="unit-label">RPM (MAX: <span id="maxRpmVal">0</span>)</div>

            <div class="time-date">
                <span id="clock">10:42</span> | <span id="dateStr">9 AUG 2026</span>
            </div>
        </div>
    </div>

    <!-- Middle Section: TPS & AFR -->
    <div class="mid-container">
        <div class="arc-card">
            <div class="arc-title">TPS</div>
            <div class="arc-val" id="tpsVal">0°</div>
        </div>
        <div class="arc-card" style="border-color: #00e676;">
            <div class="arc-title" style="color: #00e676;">AFR</div>
            <div class="arc-val" id="afrVal">0.0</div>
        </div>
    </div>

    <!-- Bottom Section: ECU Data Grid (2 Columns) -->
    <div class="bottom-container">
        <div class="data-card trip-card" onclick="resetTrip()" title="แตะเพื่อรีเซ็ตระยะทาง">
            <div class="data-label">TRIP DISTANCE <span>(km)</span></div>
            <div class="data-val" id="tripVal" style="color: #00e676;">0.00</div>
        </div>
        <div class="data-card"><div class="data-label">INJ <span>(ms)</span></div><div class="data-val" id="injVal">0.00</div></div>
        <div class="data-card"><div class="data-label">IGN <span>(deg)</span></div><div class="data-val" id="ignVal">0.0</div></div>
        <div class="data-card"><div class="data-label">COOLANT <span>(°C)</span></div><div class="data-val" id="ectVal">40</div></div>
        <div class="data-card"><div class="data-label">MAP <span>(kPa)</span></div><div class="data-val" id="mapVal">0</div></div>
        <div class="data-card"><div class="data-label">IAT <span>(°C)</span></div><div class="data-val" id="iatVal">0</div></div>
        <div class="data-card"><div class="data-label">BAT <span>(V)</span></div><div class="data-val" id="batVal">12.6</div></div>
    </div>

    <!-- Footer: Bluetooth & Status -->
    <div class="footer-bar">
        <div class="bt-btn" onclick="connectBLE()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 12.46L13 20.17v-3.76l1.88 1.88z"/></svg>
        </div>
        <div class="status-text">MOS REMAP PERFORMANCE</div>
    </div>
</div>

<script>
    let txCharacteristic;
    let maxSpeed = 0;
    let maxRpm = 0;
    let tripDistanceKm = 0;
    let lastLat = null;
    let lastLng = null;

    window.onload = function() {
        initGPS();
    };

    function initGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    document.getElementById('gpsStatus').innerText = "GPS: READY";
                    document.getElementById('gpsStatus').style.color = "#00e676";

                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let speedMps = position.coords.speed;
                    let currentSpeed = 0;

                    if (speedMps !== null && speedMps > 0) {
                        currentSpeed = Math.round(speedMps * 3.6);
                    }

                    document.getElementById('speedVal').innerText = currentSpeed;

                    if (currentSpeed > maxSpeed) {
                        maxSpeed = currentSpeed;
                        document.getElementById('maxSpeedVal').innerText = maxSpeed;
                    }

                    if (lastLat !== null && lastLng !== null) {
                        let dist = calcDistanceHaversine(lastLat, lastLng, lat, lng);
                        if (currentSpeed > 1 && dist > 0.003) {
                            tripDistanceKm += dist;
                            document.getElementById('tripVal').innerText = tripDistanceKm.toFixed(2);
                        }
                    }

                    lastLat = lat;
                    lastLng = lng;
                },
                (error) => {
                    document.getElementById('gpsStatus').innerText = "GPS: ERROR";
                    document.getElementById('gpsStatus').style.color = "#ff1744";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        } else {
            document.getElementById('gpsStatus').innerText = "GPS: NOT SUPPORTED";
        }
    }

    function calcDistanceHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function resetTrip() {
        if (confirm("ต้องการรีเซ็ตระยะทางสะสม (TRIP) เป็น 0 หรือไม่?")) {
            tripDistanceKm = 0;
            document.getElementById('tripVal').innerText = "0.00";
        }
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toTimeString().substring(0,5);
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        document.getElementById('dateStr').innerText = now.toLocaleDateString('en-GB', options).toUpperCase();
    }, 1000);

    async function connectBLE() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_ECU_BLE' }],
                optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
            });

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
            const rxCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
            txCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

            await rxCharacteristic.startNotifications();
            rxCharacteristic.addEventListener('characteristicvaluechanged', handleData);
            alert("เชื่อมต่อ Bluetooth เรียบร้อย!");
        } catch (error) {
            alert("เชื่อมต่อล้มเหลว: " + error);
        }
    }

    function handleData(event) {
        const decoder = new TextDecoder('utf-8');
        const dataStr = decoder.decode(event.target.value);
        
        if (dataStr.includes("RPM:")) {
            const parts = dataStr.split('|');
            const currentRpm = parseInt(parts[0].replace(/[^0-9]/g, '')) || 0;
            const currentTps = parseInt(parts[1].replace(/[^0-9]/g, '')) || 0;

            document.getElementById('rpmVal').innerText = currentRpm;
            document.getElementById('tpsVal').innerText = currentTps + '°';

            if (currentRpm > maxRpm) {
                maxRpm = currentRpm;
                document.getElementById('maxRpmVal').innerText = maxRpm;
            }
        }
    }

    function resetMaxValues() {
        if (confirm("ต้องการรีเซ็ตค่า Max Speed และ Max RPM หรือไม่?")) {
            maxSpeed = 0;
            maxRpm = 0;
            document.getElementById('maxSpeedVal').innerText = 0;
            document.getElementById('maxRpmVal').innerText = 0;
        }
    }

    async function clearDTC() {
        if (txCharacteristic) {
            const encoder = new TextEncoder();
            await txCharacteristic.writeValue(encoder.encode('CLEAR'));
            alert('ส่งคำสั่งลบโค้ด (Clear DTC) เรียบร้อย');
        } else {
            alert('กรุณากดปุ่ม Bluetooth เพื่อเชื่อมต่อก่อน');
        }
    }
</script>

</body>
</html>
