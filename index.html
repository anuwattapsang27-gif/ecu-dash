<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOS REMAP DASHBOARD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Gadget, sans-serif; user-select: none; }
        body { background-color: #080808; color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Portrait Container */
        .dashboard { width: 100vw; height: 100vh; max-width: 480px; background: radial-gradient(circle, #151515 0%, #050505 100%); border: 1px solid #222; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        
        /* Top Navigation Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 30px; z-index: 10; }
        .menu-btn { font-size: 22px; color: #fff; cursor: pointer; text-shadow: 0 0 5px #fff; }
        .brand-text { font-size: 14px; font-weight: 900; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }
        .brand-text span { color: #ff3d00; }
        .gps-status { font-size: 10px; color: #00e676; letter-spacing: 1px; font-weight: bold; }

        /* Arc Gauge Area */
        .arc-gauge-container { position: relative; width: 100%; height: 210px; display: flex; justify-content: center; align-items: center; margin-top: 5px; }
        .arc-svg { width: 280px; height: 210px; transform: rotate(0deg); }
        
        .arc-bg { fill: none; stroke: #1a1a1a; stroke-width: 14; stroke-linecap: round; }
        .arc-progress { fill: none; stroke: url(#rpmGradient); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 0.1s linear; }

        /* Center Speed & RPM Info Inside Arc */
        .gauge-center-info { position: absolute; top: 55px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .max-badge { font-size: 9px; color: #ff3d00; background: rgba(255,61,0,0.15); border: 1px solid rgba(255,61,0,0.4); padding: 1px 8px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
        .speed-val { font-size: 58px; font-weight: 900; color: #fff; line-height: 0.9; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .unit-label { font-size: 10px; color: #777; letter-spacing: 1px; margin-bottom: 4px; }
        .rpm-display { font-size: 18px; color: #ff3d00; font-weight: 900; background: rgba(255,61,0,0.1); padding: 2px 12px; border-radius: 4px; border: 1px solid rgba(255,61,0,0.3); }
        
        .time-date { font-size: 9px; color: #666; margin-top: 6px; }

        /* Middle Quick Cards (TPS & AFR) */
        .mid-container { display: flex; gap: 10px; width: 100%; }
        .arc-card { flex: 1; background: rgba(255,255,255,0.03); border-left: 4px solid #ffff00; border-radius: 6px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1e1e1e; }
        .arc-title { font-size: 12px; color: #ffff00; font-weight: bold; }
        .arc-val { font-size: 22px; font-weight: bold; color: #fff; }

        /* Bottom ECU Data Grid */
        .bottom-container { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px; border: 1px solid #1c1c1c; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .data-card { background: rgba(255,255,255,0.02); border-radius: 4px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; }
        .data-label { font-size: 11px; color: #ffff00; font-weight: bold; }
        .data-label span { font-size: 8px; color: #777; }
        .data-val { font-size: 13px; font-weight: bold; color: #fff; }
        
        .trip-card { grid-column: span 2; background: rgba(0, 230, 118, 0.08); border: 1px solid rgba(0, 230, 118, 0.2); cursor: pointer; }
        .trip-card .data-label { color: #00e676; }

        /* Footer Bar */
        .footer-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 4px; }
        .bt-btn { width: 38px; height: 38px; border-radius: 50%; background: #ff1744; border: 2px solid #fff; display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; box-shadow: 0 0 10px rgba(255,23,68,0.7); }
        .status-text { font-size: 9px; color: #555; font-weight: bold; text-align: right; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="menu-btn" onclick="clearDTC()">☰</div>
        <div class="brand-text">MOS <span>REMAP</span></div>
        <div class="gps-status" id="gpsStatus">GPS: WAITING</div>
    </div>

    <!-- Semi-Circle Arc Gauge Area -->
    <div class="arc-gauge-container">
        <svg class="arc-svg" viewBox="0 0 200 150">
            <defs>
                <linearGradient id="rpmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00e676" />
                    <stop offset="60%" stop-color="#ffff00" />
                    <stop offset="100%" stop-color="#ff1744" />
                </linearGradient>
            </defs>
            <!-- Background Arc -->
            <path class="arc-bg" d="M 30 130 A 70 70 0 1 1 170 130" />
            <!-- Active Progress Arc -->
            <path class="arc-progress" id="rpmArc" d="M 30 130 A 70 70 0 1 1 170 130" />
        </svg>

        <div class="gauge-center-info">
            <div class="max-badge" onclick="resetMaxValues()" title="แตะเพื่อรีเซ็ต">
                MAX: <span id="maxSpeedVal">0</span> km/h
            </div>
            <div class="speed-val" id="speedVal">0</div>
            <div class="unit-label">km/h (GPS)</div>
            <div class="rpm-display"><span id="rpmVal">0</span> <span style="font-size:10px;">RPM</span></div>
            <div class="time-date">
                <span id="clock">10:42</span> | <span id="dateStr">9 AUG 2026</span>
            </div>
        </div>
    </div>

    <!-- Middle Section: TPS & AFR -->
    <div class="mid-container">
        <div class="arc-card">
            <div class="arc-title">TPS</div>
            <div class="arc-val" id="tpsVal">0°</div>
        </div>
        <div class="arc-card" style="border-color: #00e676;">
            <div class="arc-title" style="color: #00e676;">AFR</div>
            <div class="arc-val" id="afrVal">0.0</div>
        </div>
    </div>

    <!-- Bottom Section: ECU Data Grid -->
    <div class="bottom-container">
        <div class="data-card trip-card" onclick="resetTrip()" title="แตะเพื่อรีเซ็ตระยะทาง">
            <div class="data-label">TRIP DISTANCE <span>(km)</span></div>
            <div class="data-val" id="tripVal" style="color: #00e676;">0.00</div>
        </div>
        <div class="data-card"><div class="data-label">INJ <span>(ms)</span></div><div class="data-val" id="injVal">0.00</div></div>
        <div class="data-card"><div class="data-label">IGN <span>(deg)</span></div><div class="data-val" id="ignVal">0.0</div></div>
        <div class="data-card"><div class="data-label">COOLANT <span>(°C)</span></div><div class="data-val" id="ectVal">40</div></div>
        <div class="data-card"><div class="data-label">MAP <span>(kPa)</span></div><div class="data-val" id="mapVal">0</div></div>
        <div class="data-card"><div class="data-label">IAT <span>(°C)</span></div><div class="data-val" id="iatVal">0</div></div>
        <div class="data-card"><div class="data-label">BAT <span>(V)</span></div><div class="data-val" id="batVal">12.6</div></div>
    </div>

    <!-- Footer: Bluetooth & Status -->
    <div class="footer-bar">
        <div class="bt-btn" onclick="connectBLE()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 12.46L13 20.17v-3.76l1.88 1.88z"/></svg>
        </div>
        <div class="status-text">MOS REMAP PERFORMANCE</div>
    </div>
</div>

<script>
    let txCharacteristic;
    let maxSpeed = 0;
    let maxRpm = 0;
    let tripDistanceKm = 0;
    let lastLat = null;
    let lastLng = null;
    
    // ตั้งค่าร้อยละของวงโค้ง RPM (สูงสุด 12,000 RPM)
    const MAX_RPM_SCALE = 12000;
    const ARC_MAX_OFFSET = 440; // ความยาวหลอด Arc

    window.onload = function() {
        initGPS();
        updateRpmArc(0);
    };

    function updateRpmArc(rpm) {
        let percent = Math.min(rpm / MAX_RPM_SCALE, 1);
        let offset = ARC_MAX_OFFSET - (ARC_MAX_OFFSET * percent * 0.75); // โค้งกวาด 75% ของวงกลม
        document.getElementById('rpmArc').style.strokeDashoffset = offset;
    }

    function initGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    document.getElementById('gpsStatus').innerText = "GPS: READY";
                    document.getElementById('gpsStatus').style.color = "#00e676";

                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let speedMps = position.coords.speed;
                    let currentSpeed = 0;

                    if (speedMps !== null && speedMps > 0) {
                        currentSpeed = Math.round(speedMps * 3.6);
                    }

                    document.getElementById('speedVal').innerText = currentSpeed;

                    if (currentSpeed > maxSpeed) {
                        maxSpeed = currentSpeed;
                        document.getElementById('maxSpeedVal').innerText = maxSpeed;
                    }

                    if (lastLat !== null && lastLng !== null) {
                        let dist = calcDistanceHaversine(lastLat, lastLng, lat, lng);
                        if (currentSpeed > 1 && dist > 0.003) {
                            tripDistanceKm += dist;
                            document.getElementById('tripVal').innerText = tripDistanceKm.toFixed(2);
                        }
                    }

                    lastLat = lat;
                    lastLng = lng;
                },
                (error) => {
                    document.getElementById('gpsStatus').innerText = "GPS: ERROR";
                    document.getElementById('gpsStatus').style.color = "#ff1744";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        } else {
            document.getElementById('gpsStatus').innerText = "GPS: NOT SUPPORTED";
        }
    }

    function calcDistanceHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function resetTrip() {
        if (confirm("ต้องการรีเซ็ตระยะทางสะสม (TRIP) เป็น 0 หรือไม่?")) {
            tripDistanceKm = 0;
            document.getElementById('tripVal').innerText = "0.00";
        }
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toTimeString().substring(0,5);
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        document.getElementById('dateStr').innerText = now.toLocaleDateString('en-GB', options).toUpperCase();
    }, 1000);

    async function connectBLE() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_ECU_BLE' }],
                optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
            });

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
            const rxCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
            txCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

            await rxCharacteristic.startNotifications();
            rxCharacteristic.addEventListener('characteristicvaluechanged', handleData);
            alert("เชื่อมต่อ Bluetooth เรียบร้อย!");
        } catch (error) {
            alert("เชื่อมต่อล้มเหลว: " + error);
        }
    }

    function handleData(event) {
        const decoder = new TextDecoder('utf-8');
        const dataStr = decoder.decode(event.target.value);
        
        if (dataStr.includes("RPM:")) {
            const parts = dataStr.split('|');
            const currentRpm = parseInt(parts[0].replace(/[^0-9]/g, '')) || 0;
            const currentTps = parseInt(parts[1].replace(/[^0-9]/g, '')) || 0;

            document.getElementById('rpmVal').innerText = currentRpm;
            document.getElementById('tpsVal').innerText = currentTps + '°';

            // อัปเดตแถบไฟ Arc RPM
            updateRpmArc(currentRpm);

            if (currentRpm > maxRpm) {
                maxRpm = currentRpm;
            }
        }
    }

    function resetMaxValues() {
        if (confirm("ต้องการรีเซ็ตค่า Max Speed หรือไม่?")) {
            maxSpeed = 0;
            maxRpm = 0;
            document.getElementById('maxSpeedVal').innerText = 0;
        }
    }

    async function clearDTC() {
        if (txCharacteristic) {
            const encoder = new TextEncoder();
            await txCharacteristic.writeValue(encoder.encode('CLEAR'));
            alert('ส่งคำสั่งลบโค้ด (Clear DTC) เรียบร้อย');
        } else {
            alert('กรุณากดปุ่ม Bluetooth เพื่อเชื่อมต่อก่อน');
        }
    }
</script>

</body>
</html>
